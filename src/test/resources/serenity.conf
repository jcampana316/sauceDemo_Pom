serenity {
  project.name = "Sauce Demo -  Compra online"
  test.root = "saucedemo"
  take.screenshots = FOR_FAILURES
  timeout = 10000
  logging = NORMAL

  report {
    show.manual.tests = false
  }
}

webdriver {
  driver = chrome
  autodownload = true
  base.url = "https://www.saucedemo.com/"

  timeouts {
    implicitlywait = 0
    fluentwait = 10000
    pageLoadTimeout = 30000
    scriptTimeout = 30000
  }

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true

    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "disable-infobars",
        "ignore-certificate-errors",
        "remote-allow-origins=*",
        "incognito",
        "disable-gpu",
        "disable-default-apps",
        "disable-popup-blocking"
      ]
    }
  }
}

headless.mode = false